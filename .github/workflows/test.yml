name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify static checks (no install needed for tests)
        run: |
          node --check src/normalize.js
          node --check src/validator.js
          node --check src/layers/staticCheck.js
          node --check src/layers/aiCheck.js
          node --check src/blocklists/german.js
          node --check src/blocklists/italian.js
          node --check src/blocklists/russian.js
          node --check src/blocklists/polish.js
          node --check src/blocklists/arabic.js
          node --check src/blocklists/greek.js
          node --check src/blocklists/turkish.js
          node --check src/blocklists/romanian.js
          node --check src/blocklists/chinese.js
          node --check src/blocklists/japanese.js
          node --check src/blocklists/korean.js
          node --check src/blocklists/hebrew.js
          node --check src/blocklists/hungarian.js
          node --check src/blocklists/dutch.js
          node --check src/blocklists/historicalFigures.js
          node --check src/contexts/index.js
          node --check src/contexts/realMadrid.js
          node --check src/contexts/fcBarcelona.js
          node --check proxy/cloudflare-worker.js
          node --check docs/lib/ocr/aiVisionExtract.js
          node --check docs/lib/ocr/documentScanner.js
          node --check docs/app.js

      - name: Run golden + adversarial test suite
        run: npm test
